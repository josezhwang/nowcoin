<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#07060e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7fb" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nowcoin Digital" />
    <meta property="og:title" content="Nowcoin Digital — Money, reimagined on-chain" />
    <meta
      property="og:description"
      content="The wallet, card, exchange and payment infrastructure for the on-chain economy."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Apply the saved (or system) theme before first paint to avoid a flash. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('nowcoin-theme')
          var theme = stored || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>Nowcoin Digital requires JavaScript to display this site.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
